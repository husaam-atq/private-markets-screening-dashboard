retrieval:
  default_top_k: 5
  min_keyword_score: 0.045
  keyword_weight: 0.75
  semantic_weight: 0.25
  section_boost_weight: 0.18
  strong_section_boost: 0.08
  adjacent_section_boost: 0.04
  max_chunk_words: 180
  overlap_words: 35
generation:
  llm_enabled: false
  llm_provider: ollama
  ollama_base_url: "http://localhost:11434"
  ollama_model: qwen3
  supported_models: [qwen3, qwen2.5, llama3.1, llama3.2, mistral]
  temperature: 0.0
  max_tokens: 700
  request_timeout_seconds: 45
diligence_questions:
  - question_id: revenue_drivers
    question: "What are the company's main revenue drivers?"
  - question_id: customer_concentration
    question: "What does the company say about customer concentration?"
  - question_id: liquidity_risks
    question: "What are the main liquidity risks?"
  - question_id: debt_obligations
    question: "What does management say about debt obligations?"
  - question_id: margin_pressure
    question: "What risks could pressure margins?"
  - question_id: capex_requirements
    question: "What capex or investment requirements are disclosed?"
  - question_id: competition
    question: "What does management say about competition?"
  - question_id: regulatory_litigation
    question: "Are there regulatory or litigation risks?"
  - question_id: key_risk_factors
    question: "What are the key risk factors?"
  - question_id: cash_flows_capital_allocation
    question: "What does management say about cash flows and capital allocation?"
