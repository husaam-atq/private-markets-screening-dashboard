default_mode: portfolio

runtime_modes:
  demo:
    description: "Fast recruiter demo snapshot."
    max_companies: 108
    max_real_filings: 20
    cache_only: false
    refresh_data: false
    commit_safe_outputs_only: true
    use_sample_fallback: true
    min_market_cap: 0
    max_market_cap: null
    sectors_included: all
  portfolio:
    description: "Main GitHub headline mode."
    max_companies: 300
    max_real_filings: 35
    cache_only: false
    refresh_data: true
    commit_safe_outputs_only: true
    use_sample_fallback: true
    min_market_cap: 0
    max_market_cap: null
    sectors_included: all
  extended:
    description: "Optional local scalability mode; do not commit huge raw outputs."
    max_companies: 750
    max_real_filings: 50
    cache_only: false
    refresh_data: true
    commit_safe_outputs_only: false
    use_sample_fallback: true
    min_market_cap: 0
    max_market_cap: null
    sectors_included: all

sec_rate_limit_per_second: 8

